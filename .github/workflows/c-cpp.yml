name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Compile C++ source files
      run: |
        set -euo pipefail
        mkdir -p /tmp/build
        find . -type f -name '*.c++' -print0 | while IFS= read -r -d '' src; do
          obj_name="$(echo "$src" | tr '/.' '__').o"
          g++ -std=c++17 -c "$src" -o "/tmp/build/$obj_name"
        done
